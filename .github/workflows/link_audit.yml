name: Topic Link Audit

# Run on demand from the Actions tab. HTTP-checks every external article link
# on docs/topics/*/index.html and uploads a report artifact. Also commits the
# report to output/link_audit/ so Tom and Claude can pick it up in a session.

on:
  push:
    paths:
      - '.github/audit-trigger.txt'
  workflow_dispatch:
    inputs:
      only_slugs:
        description: 'Optional: space-separated topic slugs to limit the audit (e.g. "preaching apologetics"). Leave blank for full site.'
        required: false
        default: ''
      commit_report:
        description: 'Commit the report files to main (output/link_audit/report.json + .csv)'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

# Only let one audit run at a time. If a new audit is triggered while one is
# running, queue it (cancel-in-progress: false) so we don't lose data.
concurrency:
  group: link-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run link audit
        id: audit
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.only_slugs }}" ]; then
            python3 scripts/audit_topic_links.py --only ${{ github.event.inputs.only_slugs }}
          else
            python3 scripts/audit_topic_links.py
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: link-audit-report
          path: output/link_audit/
          if-no-files-found: error

      - name: Commit report to repo
        # Commit on workflow_dispatch when commit_report=true (default) OR on any push trigger.
        if: ${{ github.event_name == 'push' || github.event.inputs.commit_report == 'true' }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the freshly-generated report files outside the working tree
          # so a hard reset can't blow them away.
          mkdir -p /tmp/link_audit_new
          cp output/link_audit/report.json /tmp/link_audit_new/report.json
          cp output/link_audit/report.csv  /tmp/link_audit_new/report.csv

          # Retry-loop: if someone else pushed between our fetch and push, the
          # push will fail with non-fast-forward; we redo the dance.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            # Restore our new reports after the reset.
            mkdir -p output/link_audit
            cp /tmp/link_audit_new/report.json output/link_audit/report.json
            cp /tmp/link_audit_new/report.csv  output/link_audit/report.csv

            git add output/link_audit/report.json output/link_audit/report.csv
            if git diff --staged --quiet; then
              echo "Report unchanged vs. main — nothing to commit."
              exit 0
            fi
            git commit -m "chore: link audit $(date -u +%Y-%m-%d)"

            if git push origin main; then
              exit 0
            fi
            echo "Push failed (attempt $attempt) — refetching and retrying..."
            sleep 2
          done
          echo "Could not push after 5 attempts." >&2
          exit 1

      - name: Fail the job if broken links were found
        if: steps.audit.outcome == 'failure'
        run: |
          echo "Broken or unreachable links were found. See the uploaded artifact and/or output/link_audit/report.csv."
          exit 1
